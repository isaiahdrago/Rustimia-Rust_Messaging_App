<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server Pathing</title>
    <style>
        body { font-family: sans-serif; max-height: 300px; max-width: 900px; margin: 80px auto; padding: 0 20px; background: #0989c9;
            background-image: url("/images/stars.gif"); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; background-attachment: fixed;}
        form { display: grid; gap: 12px; padding: 24px; background: white; border-radius: 8px;}
        input, button { box-sizing: border-box; padding: 10px; font-size: 1rem; }
        #container {display: flex; flex-direction: column; gap: 20px; font-size: 1.2rem;}
        #container input, #container button { font-size: 1.2rem; padding: 12px; }
        #server-form, #public-server-form { width: 100%; box-sizing: border-box;}
        #pub-servers { height: 300px; border: 1px solid #0989c9; background-color: white; 
            overflow-y: auto; padding: 10px; margin-bottom: 10px;
            display: flex; flex-direction: column; }
        button { cursor: pointer; }
        #error { min-height: 1.2em; color: #b00020; }
    </style>
</head>
<body>
    <div id="container">
    <form id="server-form">
        <div id="element-1">
            <h2>Servers</h2>
            <div style="margin-bottom: 5px;">
                <input name="name" placeholder="Server Name" required>
                <input type="checkbox" id="public" name="public">
                <label for="public">Make the Server Public?</label>
            </div>
            <div>
                <button type="submit">Create Server</button>
                <button type="button" id="enter">Enter Server</button>
                <button type="button" onclick="window.location.href = '/delete_server'">Delete Server</button>
                <button type="button" onclick="window.location.href = '/'">Logout</button>
            </div>
            <div id="error" role="alert"></div>
        </div>
    </form>
    <form id="public-server-form">
        <div id="element-2">
            <h2>Public Servers</h2>
            <div id="pub-servers"></div>
        </div>    
    </form>
    </div>
    <script>
        const form = document.getElementById("server-form");
        const enterButton = document.getElementById("enter");
        const error = document.getElementById("error");
        const inputs = document.getElementsByTagName("input");
        const publicCheckBox = document.getElementById("public");

        enterButton.addEventListener("click", async () => {
            error.textContent = "";
            const response = await fetch("/enter-server", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: form.elements.name.value,
                    public: publicCheckBox.checked,
                })
            });
            if (response.ok) {
                const server = await response.json();
                window.location.href = `/servers/${encodeURIComponent(server.name)}`;
            } else { 
                clearInputs();
                error.textContent = response.status === 404
                    ? "Server does not exist."
                    : "Unable to enter server. Please try again.";
            }
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            error.textContent = "";
            const response = await fetch("/server", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    name: form.elements.name.value.trim(),
                    public: publicCheckBox.checked
                })
            });
            if (response.ok) {
                const server = await response.json();
                window.location.href = `/servers/${encodeURIComponent(server.name)}`;
            } else {
                clearInputs();
                error.textContent = response.status === 401
                    ? "Invalid server id"
                    : response.status === 409
                    ? "Server name already exists."
                    : "Unable to create server. Please try again.";
            }
        });

        function clearInputs() {
            for (let i = 0; i < inputs.length; i++) {
                inputs[i].value = ''; // Sets the value to empty
            }
        };

        function timeAgo(createdAt) {
            const created = new Date(`${createdAt.replace(" ", "T")}Z`);
            const seconds = Math.floor((Date.now() - created.getTime()) / 1000);

            if (seconds < 60) return "just now";
            if (seconds < 3600) return `created ${Math.floor(seconds / 60)} minutes ago`;
            if (seconds < 86400) return `created ${Math.floor(seconds / 3600)} hours ago`;
            const days = Math.floor(seconds / 86400)
            if (days < 7) return `created ${days} days ago`;
            if (days < 365) return `created ${Math.floor(days / 7)} weeks ago`;
            return `created ${Math.floor(days / 365)} years ago`;
        }

        async function public_server() {
            const response = await fetch("/public_servers");
            if (!response.ok) {
                return;
            }

            const servers = await response.json();
            const pubButtonContainer = document.getElementById("pub-servers");

            pubButtonContainer.replaceChildren();

            servers.forEach(server => {
                const button = document.createElement("button");
                button.type = "button";
                button.style.margin = "5px";
                button.textContent = `${server.name} - ${timeAgo(server.created_at)}`;
                button.addEventListener("click", () => {
                    window.location.href = `/servers/${encodeURIComponent(server.name)}`;
                });
                pubButtonContainer.appendChild(button);
            });
        }

        public_server();
    </script>
</body>
</html>
